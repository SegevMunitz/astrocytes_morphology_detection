# AstroSeg v2 is trained from random initialization; no Cellpose checkpoint is loaded.
seed: 42

data:
  manifest_path: ${ASTROSEG_DATA_ROOT}/outputs/datasets/${ASTROSEG_DATASET_NAME}/metadata/manifest_instances.csv
  input_mode: fluorescence
  patch_size: 512
  overlap: 96
  num_workers: 0
  max_nucleus_distance: 64.0
  soma_radius: 20.0
  offset_scale: 256.0
  train_annotation_statuses: [seed, corrected, reviewed]

model:
  architecture: astroseg_instance_unet
  initialization: random
  input_channels: 3
  num_classes: 4
  base_channels: 32

training:
  epochs: 60
  batch_size: 4
  mixed_precision: true
  learning_rate: 0.0006
  weight_decay: 0.0001
  early_stopping_patience: 12
  lr_patience: 4
  lr_reduce_factor: 0.5
  minimum_learning_rate: 0.000005
  checkpoint_metric: validation_instance_proxy
  save_every: 5

loss:
  # A dedicated foreground objective aligns training with whole-cell IoU. The
  # other heads preserve compartments, touching-cell boundaries, and ownership.
  foreground_weight: 1.5
  semantic_weight: 0.5
  boundary_weight: 0.75
  offset_weight: 4.0
  foreground_class_weights: [0.35, 1.0]
  semantic_class_weights: [0.25, 1.5, 0.8, 1.0]
  boundary_class_weights: [0.15, 2.5]

augmentation:
  auxiliary_dropout_probability: 0.5

semi_supervised:
  enabled: true
  # Every one of the 23 unlabeled training images is consumed each epoch. The
  # EMA teacher is created from this random model, never from Cellpose.
  consistency_weight: 0.4
  confidence_threshold: 0.85
  ema_decay: 0.995
  ramp_epochs: 10

cross_validation:
  enabled: true
  n_splits: 5
  validation_fold: 0
  group_column: image_id
  fold_column: instance_fold

postprocessing:
  foreground_threshold: 0.5
  boundary_threshold: 0.6
  max_nucleus_to_gfap_distance: 8.0
  nucleus_support_expansion: 4
  min_nucleus_foreground_fraction: 0.05
  nucleus_probability_threshold: 0.4
  offset_scale: 256.0
  max_offset_endpoint_distance: 32.0
  soma_expansion: 4
  soma_radius: 20.0
  min_cell_area: 50
  min_gfap_area: 20

output:
  directory: ${ASTROSEG_DATA_ROOT}/outputs/checkpoints/astroseg_v2
