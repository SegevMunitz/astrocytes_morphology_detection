# Cluster-native complete-cell workflow. Set ASTROSEG_DATA_ROOT before use;
# Slurm scripts default it to $HOME/astroseg_data.
seed: 42

data:
  manifest_path: ${ASTROSEG_DATA_ROOT}/outputs/datasets/${ASTROSEG_DATASET_NAME}/metadata/manifest_instances.csv
  # Three fluorescence planes in fixed GFAP/Cy5, GFP, DAPI order. Missing GFP
  # acquisitions receive a zero auxiliary plane; transmitted light is excluded.
  input_mode: fluorescence
  patch_size: 512
  overlap: 64
  num_workers: 0
  max_nucleus_distance: 64.0
  soma_radius: 20.0
  offset_scale: 256.0
  train_annotation_statuses:
    - seed
    - corrected
    - reviewed

model:
  architecture: multichannel_instance_unet
  input_channels: 3
  num_classes: 4
  base_channels: 24

training:
  epochs: 100
  batch_size: 4
  mixed_precision: true
  learning_rate: 0.0003
  weight_decay: 0.0001
  early_stopping_patience: 15
  lr_patience: 5
  lr_reduce_factor: 0.5
  minimum_learning_rate: 0.000001

loss:
  semantic_weight: 1.0
  boundary_weight: 1.0
  offset_weight: 2.0
  semantic_class_weights: [0.25, 1.5, 1.0, 1.0]
  boundary_class_weights: [0.2, 2.0]

# Test acquisitions contain Cy5 and DAPI but no GFP. Randomly dropping the GFP
# plane prevents the model from depending on a stain that is absent at inference.
augmentation:
  auxiliary_dropout_probability: 0.5

# The 22 training images without masks contribute through a mean-teacher
# consistency objective. They never receive fabricated ground-truth labels.
semi_supervised:
  enabled: true
  consistency_weight: 0.25
  confidence_threshold: 0.8
  ema_decay: 0.99
  ramp_epochs: 10

cross_validation:
  enabled: true
  n_splits: 5
  validation_fold: 0
  group_column: image_id
  fold_column: instance_fold

postprocessing:
  foreground_threshold: 0.5
  boundary_threshold: 0.5
  max_nucleus_to_gfap_distance: 16.0
  offset_scale: 256.0
  max_offset_endpoint_distance: 32.0
  soma_expansion: 4
  soma_radius: 20.0
  min_cell_area: 50
  min_gfap_area: 20

output:
  directory: ${ASTROSEG_DATA_ROOT}/outputs/checkpoints/astrocyte_instances
