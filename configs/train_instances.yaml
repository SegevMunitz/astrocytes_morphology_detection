# Final-task model: complete individual astrocytes with nucleus ownership.
seed: 42

data:
  manifest_path: data/metadata/manifest.csv
  input_mode: fluorescence
  patch_size: 512
  overlap: 64
  num_workers: 0
  max_nucleus_distance: 64.0
  soma_radius: 20.0
  offset_scale: 256.0
  train_annotation_statuses:
    - seed
    - corrected
    - reviewed

model:
  architecture: multichannel_instance_unet
  input_channels: 3
  num_classes: 4
  base_channels: 24

training:
  epochs: 100
  batch_size: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  early_stopping_patience: 15
  lr_patience: 5
  lr_reduce_factor: 0.5
  minimum_learning_rate: 0.000001
  checkpoint_metric: validation_joint_dice
  save_every: 10

loss:
  semantic_weight: 1.0
  boundary_weight: 1.0
  offset_weight: 2.0
  semantic_class_weights: [0.25, 1.5, 1.0, 1.0]
  boundary_class_weights: [0.2, 2.0]

augmentation:
  auxiliary_dropout_probability: 0.5

semi_supervised:
  enabled: false
  consistency_weight: 0.25
  confidence_threshold: 0.8
  ema_decay: 0.99
  ramp_epochs: 10

cross_validation:
  enabled: true
  n_splits: 5
  validation_fold: 0
  # Use well_id when several fields originate from one biological well.
  group_column: image_id
  fold_column: instance_fold

postprocessing:
  foreground_threshold: 0.5
  boundary_threshold: 0.5
  max_nucleus_to_gfap_distance: 16.0
  nucleus_support_expansion: 4
  min_nucleus_foreground_fraction: 0.0
  offset_scale: 256.0
  max_offset_endpoint_distance: 32.0
  soma_expansion: 4
  soma_radius: 20.0
  min_cell_area: 50
  min_gfap_area: 20

output:
  directory: outputs/checkpoints/astrocyte_instances
