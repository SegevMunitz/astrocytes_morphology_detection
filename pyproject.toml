[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrocyte-segmentation"
version = "0.1.0"
description = "Nucleus-guided instance segmentation of complete GFAP-positive astrocytes"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "ome-types>=0.5",
    "pandas>=2.1",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "tifffile>=2023.9.26",
    "torch>=2.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
